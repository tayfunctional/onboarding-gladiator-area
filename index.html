<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Gladiator Area 76 — Member Onboarding</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="logo.svg" alt="Gladiator Area 76 Member Onboarding" class="brand-logo" />
      </div>
      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress-label"><span id="stepLabel">Frage 1 von 10</span><span id="progressPercent">10%</span></div>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      </div>
    </header>

    <main id="app" class="main"></main>

    <footer class="footer">
      <span>Keine persönlichen Daten · Keine Speicherung · Nur für das aktuelle Gespräch</span>
      <button class="link-btn" id="resetBtn" type="button" hidden>Neu starten</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
